<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-4">Nuevo empleado</h1>

    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">
        Error al crear el empleado.
    </div>

    <form th:action="@{/responsable/empleados/create}" th:object="${empleado}" method="post">
        <div class="card mb-4">
            <div class="card-header">Datos de acceso</div>
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" th:field="*{username}" required>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Datos del empleado</div>
            <div class="card-body row g-3">
                <div class="col-md-4">
                    <label for="tipo" class="form-label">Tipo de empleado</label>
                    <select id="tipo"  class="form-select" th:field="*{tipo}" required>
                        <option value="">Seleccionar...</option>
                        <option value="COCINERO">Cocinero</option>
                        <option value="CAJERO">Cajero</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre"  type="text"  class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-4">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input id="apellido"  type="text" class="form-control" th:field="*{apellido}" required>
                </div>
                <div class="col-md-4">
                    <label for="dni" class="form-label">DNI</label>
                    <input id="dni"  type="number" min="1" class="form-control" th:field="*{dni}" required>
                </div>
                <div class="col-md-4">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input id="fechaNacimiento"  type="date" class="form-control" th:field="*{fechaNacimiento}" required>
                </div>
                <div class="col-md-4">
                    <label for="fechaIngreso" class="form-label">Fecha de ingreso</label>
                    <input id="fechaIngreso"  type="date" class="form-control" th:field="*{fechaIngreso}" required>
                </div>
            </div>
        </div>

        <div id="datosCocinero" class="card mb-4 d-none">
            <div class="card-header">Atributos del cocinero</div>
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select id="especialidad" class="form-select" th:field="*{especialidad}">
                        <option value="">Seleccionar...</option>
                        <option th:each="esp : ${especialidades}" th:value="${esp}" th:text="${esp}"></option>
<!--                        <option value="COCINERO">Cocinero</option>-->
<!--                        <option value="COCINERO_AYUDANTE">Cocinero ayudante</option>-->
<!--                        <option value="LAVAPLATOS">Lavaplatos</option>-->
                    </select>
                </div>
            </div>
        </div>

        <div id="datosCajero" class="card mb-4 d-none">
            <div class="card-header">Atributos del cajero</div>
            <div class="card-body">
                <label for="turno" class="form-label">Turno</label>
                <select id="turno" name="turno" class="form-select">
                    <option value="">Seleccionar...</option>
                    <option th:each="tur : ${turnos}" th:value="${tur}" th:text="${tur}"></option>
<!--                    <option value="TURNO_MANIANA">Mañana</option>-->
<!--                    <option value="TURNO_TARDE">Tarde</option>-->
<!--                    <option value="TURNO_NOCHE">Noche</option>-->
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Crear empleado</button>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
<script>
    const tipo = document.getElementById('tipo');
    const datosCocinero = document.getElementById('datosCocinero');
    const datosCajero = document.getElementById('datosCajero');

    function mostrarAtributos() {
        datosCocinero.classList.toggle('d-none', tipo.value !== 'COCINERO');
        datosCajero.classList.toggle('d-none', tipo.value !== 'CAJERO');
    }

    tipo.addEventListener('change', mostrarAtributos);
    mostrarAtributos();
</script>
</body>
</html>
