
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de pedidos - Epicentro Gourmet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 { color: #263238; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        th {
            background: #263238;
            color: white;
        }

        .total {
            font-weight: bold;
            color: #218838;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #263238;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h1>Historial de pedidos</h1>
    <p>Pedidos registrados en tu unidad de venta.</p>

    <div th:if="${#lists.isEmpty(pedidos)}">
        <p>No hay pedidos registrados.</p>
    </div>

    <table th:unless="${#lists.isEmpty(pedidos)}">
        <thead>
            <tr>
                <th>Nº Pedido</th>
                <th>Fecha</th>
                <th>Caja</th>
                <th>Platos</th>
				<th>Observaciones</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="pedido : ${pedidos}">

                <td th:text="${pedido.idPedido}"></td>

                <td th:text="${pedido.fechaCreacion != null
                    ? #temporals.format(
                        pedido.fechaCreacion,
                        'dd/MM/yyyy HH:mm')
                    : 'Sin fecha'}"></td>

                <td th:text="${pedido.cierreCaja != null
                    ? pedido.cierreCaja.idCierreCaja
                    : 'Sin caja'}"></td>

                <td>
                    <div th:each="detalle : ${pedido.detallesPedidos}">
                        <span th:text="${'Plato #' + detalle.plato.idPlato}"></span>
                        <span th:text="${' x ' + detalle.cantidad}"></span>
                        <span th:text="${' - $' + detalle.subtotal}"></span>
                    </div>
                </td>
				
				<td th:text="${pedido.observaciones != null
				        and !pedido.observaciones.isEmpty()
				        ? pedido.observaciones
				        : 'Sin observaciones'}">
				</td>

                <td class="total"
                    th:text="${'$' + pedido.total}">
                </td>
				
				<td th:text="${pedido.observaciones != null
				        and !pedido.observaciones.isEmpty()
				        ? pedido.observaciones
				        : 'Sin observaciones'}">
				</td>

            </tr>
        </tbody>
    </table>

    <a th:href="@{/empleado/mi-informacion}" class="volver">
        Volver a Mi Información
    </a>

</div>

</body>
</html>
