<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prueba</title>
</head>
<body>
    <h1>Unidades de venta</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Responsable</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${unidades}">
                <td th:text="${u.idUnidadVenta}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.responsable}"></td>
                <td>
                    <a th:href="@{/admin/unidades-venta/{id}/editar(id=${u.idUnidadVenta})}">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
