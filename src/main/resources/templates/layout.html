<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>

    <!-- Navbar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <!-- Logo principal -->
            <a class="navbar-brand fw-bold" sec:authorize="isAuthenticated()" th:href="@{/index}">Epicentro Gourmet</a>
            <a class="navbar-brand fw-bold" sec:authorize="!isAuthenticated()" th:href="@{/}">Epicentro Gourmet</a>

            <!-- Botón responsive para celulares -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContenido">

                <!-- ENLACES A LA IZQUIERDA -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/index}">Inicio</a>
                        <a class="nav-link" sec:authorize="!isAuthenticated()" th:href="@{/}">Inicio</a>
                    </li>
                    <!-- Si es Responsable -->
                    <li class="nav-item" sec:authorize="hasRole('RESPONSABLE')">
                        <a class="nav-link" th:href="@{/responsable/}">Panel Responsable</a>
                    </li>
                    <!-- Si es Admin -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/festivales}">Festivales</a>
                    </li>
                </ul>

                <!-- EXTREMO DERECHO: Si NO está logueado -->
                <div sec:authorize="!isAuthenticated()" style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar Sesión</a>
                    <a class="btn btn-success btn-sm" th:href="@{/unidad-venta/registrar}">Registrar Unidad de Venta</a>
                </div>

                <!-- EXTREMO DERECHO: Si SÍ está logueado (con dropdown) -->
                <ul class="navbar-nav mb-2 mb-lg-0 align-items-center" sec:authorize="isAuthenticated()" style="margin-left: auto;">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-bold" href="#" id="menuUsuario" role="button"
                           data-bs-toggle="dropdown" data-toggle="dropdown" aria-expanded="false">
                            <span sec:authentication="name">Juilio3p</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="menuUsuario">
                            <li class="px-3 py-1">
                                <small class="text-muted d-block">Rol:</small>
                                <span class="badge bg-success" sec:authorize="hasRole('RESPONSABLE')">Responsable</span>
                                <span class="badge bg-primary" sec:authorize="hasRole('ADMIN')">Admin</span>
                                <span class="badge bg-info text-dark" sec:authorize="hasRole('EMPLEADO')">Empleado</span>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger fw-bold" th:href="@{/logout}">
                                    Cerrar Sesión
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>

            </div>
        </div>
    </nav>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 UNLA - Trabajo Práctico Grupo 4</p>
        </div>
    </footer>

    <!-- Scripts -->
    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </div>

</body>
</html>
