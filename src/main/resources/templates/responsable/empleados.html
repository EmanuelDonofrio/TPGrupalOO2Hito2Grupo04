<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h1>Empleados</h1>
            <p class="text-muted mb-0">Administración de empleados de la unidad de venta.</p>
        </div>
        <a th:href="@{/empleado/nuevo}" class="btn btn-success">
            Agregar nuevo empleado
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre y apellido</th>
                <th scope="col">Antigüedad</th>
                <th scope="col">DNI</th>
                <th scope="col">Fecha de ingreso</th>
                <th scope="col">Fecha de nacimiento</th>
                <th scope="col">Sueldo base</th>
                <th scope="col">Modificar</th>
                <th scope="col">Eliminar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.idEmpleado}"></td>
                <td th:text="${empleado.nombre + ' ' + empleado.apellido}"></td>
                <td th:text="${empleado.antiguedad + ' años'}"></td>
                <td th:text="${empleado.dni}"></td>
                <td th:text="${#temporals.format(empleado.fechaIngreso, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(empleado.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatDecimal(empleado.sueldoBase, 1, 2)}"></td>
                <td>
                    <a th:href="@{/empleado/editar/{id}(id=${empleado.idEmpleado})}"
                       class="btn btn-warning btn-sm">Modificar</a>
                </td>
                <td>
                    <form th:action="@{/empleado/eliminar/{id}(id=${empleado.idEmpleado})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('¿Desea eliminar este empleado?');">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="9" class="text-center text-muted">No hay empleados registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
