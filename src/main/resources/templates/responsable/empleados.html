<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<style>
    .employee-table-wrapper {
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-color: #9aa8b2 #edf0f2;
        scrollbar-width: thin;
    }

    .employee-table-wrapper::-webkit-scrollbar {
        height: 8px;
    }

    .employee-table-wrapper::-webkit-scrollbar-track {
        background: #edf0f2;
        border-radius: 8px;
    }

    .employee-table-wrapper::-webkit-scrollbar-thumb {
        background: #9aa8b2;
        border-radius: 8px;
    }

    .employee-table {
        min-width: 1050px;
        white-space: nowrap;
    }
</style>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">

    <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h1>Empleados</h1>
            <p class="text-muted mb-0">Administración de empleados de la unidad de venta.</p>
        </div>
        <a th:href="@{/responsable/empleados/nuevo}" class="btn btn-success">
            Agregar nuevo empleado
        </a>
    </div>

    <div class="employee-table-wrapper">
        <table class="table table-striped table-hover align-middle employee-table">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre y apellido</th>
                <th scope="col">Antigüedad</th>
                <th scope="col">DNI</th>
                <th scope="col">Fecha de ingreso</th>
                <th scope="col">Fecha de nacimiento</th>
                <th scope="col">Sueldo base</th>
                <th scope="col">Tipo</th>
                <th scope="col">Especialidad / turno</th>
                <th scope="col">Accion</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.idEmpleado}"></td>
                <td th:text="${empleado.nombre + ' ' + empleado.apellido}"></td>
                <td th:text="${empleado.antiguedad + ' años'}"></td>
                <td th:text="${empleado.dni}"></td>
                <td th:text="${#temporals.format(empleado.fechaIngreso, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(empleado.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatDecimal(empleado.sueldoBase, 1, 2)}"></td>
                <td>
                    <span th:if="${empleado instanceof T(com.epicentroGourmet.entities.Cocinero)}">
                        Cocinero
                    </span>
                    <span th:if="${empleado instanceof T(com.epicentroGourmet.entities.Cajero)}">
                        Cajero
                    </span>
                </td>
                <td>
                    <span th:if="${empleado instanceof T(com.epicentroGourmet.entities.Cocinero)}"
                          th:text="${empleado.especialidad}">
                        Especialidad
                    </span>
                    <span th:if="${empleado instanceof T(com.epicentroGourmet.entities.Cajero)}"
                          th:text="${empleado.turno}">
                        Turno
                    </span>
                </td>
                <td>
                    <form th:action="@{/responsable/empleados/eliminar/{id}(id=${empleado.idEmpleado})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('¿Desea dar de baja el empleado?');">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Dar de baja
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="10" class="text-center text-muted">No hay empleados registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
