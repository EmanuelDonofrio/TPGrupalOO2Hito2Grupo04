<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">Registrar Unidad de Venta y Responsable</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/unidad-venta/registrar}" th:object="${unidadDTO}" method="post">

                        <!-- 1. UNIDAD DE VENTA -->
                        <h5 class="text-primary border-bottom pb-2 mb-3">1. Datos de la Unidad de Venta</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Nombre Comercial *</label>
                                <input type="text" class="form-control" th:field="*{nombreComercial}">
                                <small class="text-danger" th:errors="*{nombreComercial}"></small>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Superficie (m²) *</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{superficie}">
                                <small class="text-danger" th:errors="*{superficie}"></small>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Código (10 car.) *</label>
                                <input type="text" maxlength="10" class="form-control" th:field="*{codigo}">
                                <small class="text-danger" th:errors="*{codigo}"></small>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Tipo de Unidad *</label>
                                <select class="form-select" id="selectTipo" th:field="*{tipoUnidad}" onchange="cambiarTipo()">
                                    <option value="">-- Seleccionar Tipo --</option>
                                    <option value="FOOD_TRUCK">Food Truck</option>
                                    <option value="PUESTO_DESARMABLE">Puesto Desarmable</option>
                                </select>
                                <small class="text-danger" th:errors="*{tipoUnidad}"></small>
                            </div>

                            <!-- Campos condicionales Food Truck -->
                            <div id="camposFoodTruck" class="row g-3 mt-1" style="display: none;">
                                <div class="col-md-6">
                                    <label class="form-label">Patente</label>
                                    <input type="text" class="form-control" th:field="*{patente}">
                                </div>
                                <div class="col-md-6 d-flex align-items-center mt-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{conexionElectrica}">
                                        <label class="form-check-label">Requiere conexión eléctrica</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Campos condicionales Puesto Desarmable -->
                            <div id="camposPuesto" class="row g-3 mt-1" style="display: none;">
                                <div class="col-md-6">
                                    <label class="form-label">Cantidad de Carpas</label>
                                    <input type="number" class="form-control" th:field="*{cantCarpas}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tiempo de Montaje (min)</label>
                                    <input type="number" class="form-control" th:field="*{tiempoMontajeMin}">
                                </div>
                            </div>
                        </div>

                        <!-- 2. DATOS DEL RESPONSABLE -->
                        <h5 class="text-primary border-bottom pb-2 mb-3">2. Datos del Responsable (Staff)</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Nombre *</label>
                                <input type="text" class="form-control" th:field="*{nombreResponsable}">
                                <small class="text-danger" th:errors="*{nombreResponsable}"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellido *</label>
                                <input type="text" class="form-control" th:field="*{apellidoResponsable}">
                                <small class="text-danger" th:errors="*{apellidoResponsable}"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">DNI *</label>
                                <input type="number" class="form-control" th:field="*{dniResponsable}">
                                <small class="text-danger" th:errors="*{dniResponsable}"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha de Nacimiento *</label>
                                <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                                <small class="text-danger" th:errors="*{fechaNacimiento}"></small>
                            </div>
                        </div>

                        <!-- 3. CUENTA DE ACCESO -->
                        <h5 class="text-primary border-bottom pb-2 mb-3">3. Cuenta de Usuario del Responsable</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Usuario *</label>
                                <input type="text" class="form-control" th:field="*{username}">
                                <small class="text-danger" th:errors="*{username}"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" th:field="*{password}">
                                <small class="text-danger" th:errors="*{password}"></small>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/}" class="btn btn-outline-secondary">Volver al Inicio</a>
                            <button type="submit" class="btn btn-success px-4">Confirmar Registro</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    function cambiarTipo() {
        const tipo = document.getElementById("selectTipo").value;
        const ft = document.getElementById("camposFoodTruck");
        const pd = document.getElementById("camposPuesto");
        if (tipo === "FOOD_TRUCK") {
            ft.style.display = "flex";
            pd.style.display = "none";
        } else if (tipo === "PUESTO_DESARMABLE") {
            ft.style.display = "none";
            pd.style.display = "flex";
        } else {
            ft.style.display = "none";
            pd.style.display = "none";
        }
    }
    document.addEventListener("DOMContentLoaded", cambiarTipo);
</script>
</body>
</html>
